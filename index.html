<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Tracker</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
}

header {
    background: #2563eb;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin-bottom: 6px;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 25px auto;
}

/* Add Student */
.add-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

.add-box h2 {
    margin-bottom: 15px;
}

.form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.form input {
    flex: 1;
    min-width: 200px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn {
    background: #2563eb;
    color: white;
}

.add-btn:hover {
    background: #1d4ed8;
}

/* Summary */
.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
    color: #666;
    font-size: 15px;
}

.card p {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
    color: #2563eb;
}

/* Attendance */
.attendance-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
    flex-wrap: wrap;
}

.date {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.mark-all {
    background: #16a34a;
    color: white;
}

.reset-btn {
    background: #dc2626;
    color: white;
}

/* Table */
.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th {
    background: #eff6ff;
    color: #1e3a8a;
}

th, td {
    padding: 13px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

.present {
    background: #16a34a;
    color: white;
}

.absent {
    background: #dc2626;
    color: white;
}

.delete {
    background: #ef4444;
    color: white;
    padding: 7px 10px;
}

.status-btn {
    min-width: 90px;
}

/* Empty */
.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

/* Mobile */
@media(max-width: 700px) {
    .summary {
        grid-template-columns: 1fr;
    }

    .form {
        flex-direction: column;
    }

    .form input {
        width: 100%;
    }

    .form button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>📋 Student Attendance Tracker</h1>
    <p>Manage students and record daily attendance</p>
</header>

<div class="container">

    <!-- Add Student -->
    <div class="add-box">
        <h2>Add Student</h2>

        <div class="form">
            <input 
                type="text" 
                id="studentName" 
                placeholder="Enter student name"
            >

            <input 
                type="text" 
                id="rollNumber" 
                placeholder="Enter roll number"
            >

            <button class="add-btn" onclick="addStudent()">
                + Add Student
            </button>
        </div>
    </div>

    <!-- Summary -->
    <div class="summary">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Present</h3>
            <p id="presentCount">0</p>
        </div>

        <div class="card">
            <h3>Absent</h3>
            <p id="absentCount">0</p>
        </div>

    </div>

    <!-- Attendance -->
    <div class="attendance-box">

        <div class="top-bar">

            <h2>Today's Attendance</h2>

            <input 
                type="date" 
                id="attendanceDate"
                class="date"
            >

            <button 
                class="mark-all"
                onclick="markAllPresent()"
            >
                Mark All Present
            </button>

            <button 
                class="reset-btn"
                onclick="resetAttendance()"
            >
                Reset
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Roll Number</th>
                        <th>Student Name</th>
                        <th>Attendance</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                </tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty">
            No students added yet.
        </div>

    </div>

</div>

<script>

// Load students from browser storage
let students = JSON.parse(localStorage.getItem("students")) || [];

// Current date
document.getElementById("attendanceDate").value =
    new Date().toISOString().split("T")[0];


// Save students
function saveStudents() {
    localStorage.setItem("students", JSON.stringify(students));
}


// Add student
function addStudent() {

    const name = document
        .getElementById("studentName")
        .value
        .trim();

    const roll = document
        .getElementById("rollNumber")
        .value
        .trim();

    if (name === "" || roll === "") {
        alert("Please enter student name and roll number.");
        return;
    }

    // Check duplicate roll number
    const exists = students.some(
        student => student.roll === roll
    );

    if (exists) {
        alert("This roll number already exists.");
        return;
    }

    const student = {
        id: Date.now(),
        name: name,
        roll: roll,
        attendance: {}
    };

    students.push(student);

    saveStudents();

    document.getElementById("studentName").value = "";
    document.getElementById("rollNumber").value = "";

    displayStudents();
}


// Display students
function displayStudents() {

    const list = document.getElementById("studentList");
    const empty = document.getElementById("emptyMessage");

    list.innerHTML = "";

    const date =
        document.getElementById("attendanceDate").value;

    if (students.length === 0) {
        empty.style.display = "block";
        updateSummary();
        return;
    }

    empty.style.display = "none";

    students.forEach((student, index) => {

        const status =
            student.attendance[date] || "Not Marked";

        const row = document.createElement("tr");

        let buttonClass = "";

        if (status === "Present") {
            buttonClass = "present";
        }

        if (status === "Absent") {
            buttonClass = "absent";
        }

        row.innerHTML = `
            <td>${index + 1}</td>

            <td>${student.roll}</td>

            <td>${student.name}</td>

            <td>
                <button 
                    class="status-btn ${buttonClass}"
                    onclick="toggleAttendance(${student.id})"
                >
                    ${status}
                </button>
            </td>

            <td>
                <button 
                    class="delete"
                    onclick="deleteStudent(${student.id})"
                >
                    Delete
                </button>
            </td>
        `;

        list.appendChild(row);
    });

    updateSummary();
}


// Toggle attendance
function toggleAttendance(id) {

    const date =
        document.getElementById("attendanceDate").value;

    const student = students.find(
        student => student.id === id
    );

    if (!student.attendance[date] ||
        student.attendance[date] === "Absent") {

        student.attendance[date] = "Present";

    } else {

        student.attendance[date] = "Absent";
    }

    saveStudents();
    displayStudents();
}


// Mark everyone present
function markAllPresent() {

    const date =
        document.getElementById("attendanceDate").value;

    students.forEach(student => {
        student.attendance[date] = "Present";
    });

    saveStudents();
    displayStudents();
}


// Reset attendance
function resetAttendance() {

    const date =
        document.getElementById("attendanceDate").value;

    if (!confirm("Reset today's attendance?")) {
        return;
    }

    students.forEach(student => {
        delete student.attendance[date];
    });

    saveStudents();
    displayStudents();
}


// Delete student
function deleteStudent(id) {

    const student = students.find(
        student => student.id === id
    );

    if (!confirm(
        "Delete " + student.name + "?"
    )) {
        return;
    }

    students = students.filter(
        student => student.id !== id
    );

    saveStudents();
    displayStudents();
}


// Update summary
function updateSummary() {

    const date =
        document.getElementById("attendanceDate").value;

    let present = 0;
    let absent = 0;

    students.forEach(student => {

        if (student.attendance[date] === "Present") {
            present++;
        }

        if (student.attendance[date] === "Absent") {
            absent++;
        }

    });

    document.getElementById("totalStudents")
        .textContent = students.length;

    document.getElementById("presentCount")
        .textContent = present;

    document.getElementById("absentCount")
        .textContent = absent;
}


// Change date
document
    .getElementById("attendanceDate")
    .addEventListener("change", displayStudents);


// Initial display
displayStudents();

</script>

</body>
</html>
